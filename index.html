<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Automotive physics simulator</title>
    <style>
        body { font-family: monospace; background: #000; color: #fff; padding: 20px; max-width: 800px; margin: auto; }
        .box { border: 1px solid #333; padding: 20px; margin-bottom: 15px; background: #0a0a0a; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        label { display: block; color: #888; font-size: 0.85rem; margin-bottom: 5px; }
        input { width: 100%; padding: 6px; background: #000; border: 1px solid #444; color: #fff; box-sizing: border-box; font-family: monospace; }
        .metric { border-left: 2px solid #fff; padding-left: 10px; margin-bottom: 12px; }
        .val { font-size: 1.1rem; font-weight: bold; }
        .formula { font-size: 0.75rem; color: #777; }
        canvas { width: 100%; height: 150px; background: #000; border: 1px solid #333; display: block; margin-top: 10px; }
        button { background: #fff; color: #000; border: none; padding: 8px 12px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; font-family: monospace; }
        button:hover { background: #ccc; }
        .bar { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 15px; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Automotive physics simulato</h2>
        
        <div class="bar">
            <span>STATUS: <strong id="lblStatus">Active</strong></span>
            <span>RPM: <strong id="lblRpm">0</strong></span>
            <span>NET ACCEL: <strong id="lblAccel">0.00</strong> m/s²</span>
        </div>

        <div class="grid">
            <div>
                <h3>Inputs</h3>
                <form onsubmit="event.preventDefault();">
                    <div style="margin-bottom:10px;">
                        <label>Power (HP):</label>
                        <input type="number" id="power" value="300" oninput="runCalculations()">
                    </div>
                    <div style="margin-bottom:10px;">
                        <label>Mass (kg):</label>
                        <input type="number" id="mass" value="1400" oninput="runCalculations()">
                    </div>
                    <div style="margin-bottom:10px;">
                        <label>Speed (km/h):</label>
                        <input type="number" id="speed" value="100" oninput="runCalculations()">
                    </div>
                    <div style="margin-bottom:10px;">
                        <label>Friction (μ):</label>
                    <input type="text" id="mu" value="0.80" oninput="runCalculations()">               
                    </div>
                </form>
                <button id="btnToggle" onclick="toggleSimulation()">Pause</button>
            </div>

            <div>
                <h3>Analytical Outputs</h3>
                
                <div class="metric">
                    <label>Power-to-Weight Ratio:</label>
                    <div class="val" id="resPMR">0.00 kg/HP</div>
                    <div class="formula">R = m / P</div>
                </div>

                <div class="metric">
                    <label>Braking Distance:</label>
                    <div class="val" id="resBraking">0.0 m</div>
                    <div class="formula">d = v² / (2 · μ · g)</div>
                </div>

                <div class="metric">
                    <label>Aerodynamic Drag:</label>
                    <div class="val" id="resAero">0.0 N</div>
                    <div class="formula">Fd = 0.5 · ρ · Cx · A · v²</div>
                </div>

                <div class="metric">
                    <label>Traction Force:</label>
                    <div class="val" id="resTraction">0.0 N</div>
                    <div class="formula">Ft = P_watts / v_ms</div>
                </div>
            </div>
        </div>

        <canvas id="physicsCanvas"></canvas>
    </div>

    <script>
        let active = true;
        let angle = 0;

      function runCalculations() {
   const parseVal = (id) => parseFloat(document.getElementById(id).value.replace(',', '.')) || 0;

const P_hp = parseVal('power');
const m_kg = parseVal('mass');
const v_kmh = parseVal('speed');
const mu = parseVal('mu');

    const v_ms = v_kmh / 3.6;
    const P_watts = P_hp * 745.7;
    const g = 9.81;

    const pmr = P_hp > 0 ? (m_kg / P_hp) : 0;
    document.getElementById('resPMR').innerText = `${pmr.toFixed(2)} kg/HP`;

    const brakingDistance = mu > 0 ? Math.pow(v_ms, 2) / (2 * mu * g) : 0;
    document.getElementById('resBraking').innerText = `${brakingDistance.toFixed(2)} m`;

    const aeroForce = 0.5 * 1.225 * 0.32 * 2.2 * Math.pow(v_ms, 2);
    document.getElementById('resAero').innerText = `${aeroForce.toFixed(2)} N`;

    let tractionForce = 0;
    const maxAdhesion = mu * m_kg * g;
    if (v_ms > 0.5) {
        tractionForce = Math.min(P_watts / v_ms, maxAdhesion);
    } else {
        tractionForce = maxAdhesion;
    }
    document.getElementById('resTraction').innerText = `${tractionForce.toFixed(2)} N`;

    const accel = m_kg > 0 ? (tractionForce - aeroForce) / m_kg : 0;
    document.getElementById('lblAccel').innerText = accel.toFixed(2);
    document.getElementById('lblRpm').innerText = Math.round(800 + (v_kmh * 35));
}
        function toggleSimulation() {
            active = !active;
            document.getElementById('lblStatus').innerText = active ? "ACTIVE" : "PAUSED";
            document.getElementById('btnToggle').innerText = active ? "Pause" : "Resume";
        }

        const canvas = document.getElementById('physicsCanvas');
        const ctx = canvas.getContext('2d');

        function adjust() {
            canvas.width = canvas.parentElement.clientWidth - 40;
            canvas.height = 150;
        }
        window.addEventListener('resize', adjust);
        adjust();

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const cx = canvas.width / 2;
            const cy = 75;
            const r = 25;

            if (active) {
                const v = parseFloat(document.getElementById('speed').value) || 0;
                angle += 0.03 + (v * 0.002);
            }

            const xCrankpin = cx + Math.cos(angle) * r;
            const yCrankpin = cy + Math.sin(angle) * r;
            const yPiston = cy - 45 - (Math.cos(angle) * 15);

            ctx.strokeStyle = '#222';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.moveTo(0, cy); ctx.lineTo(canvas.width, cy);
            ctx.moveTo(cx, 0); ctx.lineTo(cx, canvas.height);
            ctx.stroke();

            ctx.strokeStyle = '#fff';
            ctx.strokeRect(cx - 20, cy - 60, 40, 40);
            ctx.fillStyle = '#666';
            ctx.fillRect(cx - 18, yPiston, 36, 15);

            ctx.beginPath();
            ctx.moveTo(xCrankpin, yCrankpin);
            ctx.lineTo(cx, yPiston + 7);
            ctx.strokeStyle = '#aaa';
            ctx.lineWidth = 2;
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(cx, cy, r, 0, Math.PI * 2);
            ctx.strokeStyle = '#444';
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(xCrankpin, yCrankpin);
            ctx.strokeStyle = '#fff';
            ctx.lineWidth = 2;
            ctx.stroke();

            requestAnimationFrame(animate);
        }

        runCalculations();
        animate();
    </script>
</body>
</html>
